<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>smoke</title></head>
<body>
  <div id="app"></div>
  <div id="result">PENDING</div>
  <script type="module">
    import { boot } from '../js/app.js';
    const log = [];
    const step = (name, ok) => log.push(`${ok ? 'OK' : 'FAIL'} ${name}`);
    try {
      boot();
      step('menu', !!document.querySelector('.card-grid') && document.querySelectorAll('.card').length >= 3);
      document.querySelector('.card').click();
      step('menu->levels', !!document.querySelector('.level-list'));
      document.querySelector('.level-list button').click();
      step('levels->game', !!document.querySelector('.game'));
      document.querySelector('.game .btn, #app > .btn').click();
      step('game->levels', !!document.querySelector('.level-list'));
      document.querySelector('#app > .btn').click();
      step('levels->menu', !!document.querySelector('.card-grid'));

      // unlock wiring: snake is the first card
      document.querySelector('.card').click(); // -> snake level select
      const btns = () => [...document.querySelectorAll('.level-list button')];
      step('level2 starts locked', btns()[1].disabled === true);
      btns()[0].click(); // -> game level 1
      [...document.querySelectorAll('button')].find(b => b.textContent === 'clear').click();
      // if the shell refreshes on clear we are already on level select; otherwise go back
      if (!document.querySelector('.level-list')) {
        document.querySelector('#app > .btn').click();
      }
      step('level2 unlocked after clear', btns()[1].disabled === false);
      // leave and re-enter: a fresh render reads storage again (reload equivalent)
      document.querySelector('#app > .btn').click(); // levels -> menu
      document.querySelector('.card').click();       // menu -> levels
      step('level2 unlock persists on re-render', btns()[1].disabled === false);
    } catch (e) {
      log.push(`THROW ${e.message}`);
    }
    document.getElementById('result').textContent = log.join(' | ');
  </script>
</body>
</html>
