<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>smoke</title></head>
<body>
  <div id="app"></div>
  <div id="result">PENDING</div>
  <script type="module">
    import { boot } from '../js/app.js';
    import { solve } from '../games/sudoku.js';
    import { resetStorage, setUnlockedLevel, getUnlockedLevel } from '../js/storage.js';
    const log = [];
    const step = (name, ok) => log.push(`${ok ? 'OK' : 'FAIL'} ${name}`);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const btns = () => [...document.querySelectorAll('.level-list button')];
    try {
      resetStorage();
      boot();
      step('menu', !!document.querySelector('.card-grid') && document.querySelectorAll('.card').length >= 3);

      // view wiring via Snake (first card, now a real game)
      document.querySelectorAll('.card')[0].click();
      step('menu->levels', !!document.querySelector('.level-list') && btns().length === 6);
      btns()[0].click();
      step('levels->game', !!document.querySelector('.game') && !!document.querySelector('.snake-grid'));

      // steer into the top wall: should die and show Game Over
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp' }));
      await sleep(2500); // ~12 ticks x 200ms reaches the wall from mid-grid
      const overlay = document.querySelector('.overlay');
      step('snake dies at wall', !!overlay && !overlay.hidden && overlay.textContent.includes('Game Over'));
      overlay.querySelector('button').click();
      step('restart hides overlay', document.querySelector('.overlay').hidden === true);

      document.querySelector('#app > .btn').click();
      step('game->levels', !!document.querySelector('.level-list'));
      document.querySelector('#app > .btn').click();
      step('levels->menu', !!document.querySelector('.card-grid'));

      // lock rendering via Bounce (third card): locked by default, unlocks via storage
      document.querySelectorAll('.card')[2].click();
      step('level2 starts locked', btns()[1].disabled === true);
      setUnlockedLevel('bounce', 2);
      document.querySelector('#app > .btn').click(); // levels -> menu
      document.querySelectorAll('.card')[2].click(); // menu -> levels (fresh render reads storage)
      step('unlock renders after storage change', btns()[1].disabled === false);

      // bounce gameplay: enter, tick a few frames, still alive
      btns()[0].click();
      step('bounce game renders', !!document.querySelector('canvas'));
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
      await sleep(120);
      window.dispatchEvent(new KeyboardEvent('keyup', { key: 'ArrowRight' }));
      step('bounce alive after ticks', document.querySelector('.overlay').hidden === true);
      document.querySelector('#app > .btn').click(); // game -> levels
      document.querySelector('#app > .btn').click(); // levels -> menu

      // sudoku (middle card): free choice of difficulty, playable, win path
      document.querySelectorAll('.card')[1].click();
      step('sudoku difficulties all unlocked', btns().length === 3 && btns().every((b) => !b.disabled));
      btns()[0].click();
      const scells = () => [...document.querySelectorAll('.sudoku-cell')];
      step('sudoku grid is 81 cells', scells().length === 81);
      const grid = scells().map((c) => (c.textContent === '' ? null : Number(c.textContent)));
      const solved = solve(grid);
      step('sudoku solver fills grid', !!solved);
      if (solved) {
        solved.forEach((v, i) => {
          if (grid[i] === null) {
            scells()[i].click();
            window.dispatchEvent(new KeyboardEvent('keydown', { key: String(v) }));
          }
        });
      }
      const so = document.querySelector('.overlay');
      step('sudoku win overlay', !!so && !so.hidden && so.textContent.includes('Solved'));
      step('sudoku clear wired to storage', getUnlockedLevel('sudoku') >= 2);
    } catch (e) {
      log.push(`THROW ${e.message}`);
    }
    document.getElementById('result').textContent = log.join(' | ');
  </script>
</body>
</html>
